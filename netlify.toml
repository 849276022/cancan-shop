[build]
  command = "echo 'Build complete'"
  publish = "pwa"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/abnormal/batch"
  to = "/.netlify/functions/abnormal-batch"
  status = 200

[[redirects]]
  from = "/api/abnormal"
  to = "/.netlify/functions/abnormal-list"
  status = 200

[[redirects]]
  from = "/api/persons/batch"
  to = "/.netlify/functions/persons-batch"
  status = 200

[[redirects]]
  from = "/api/persons/:id"
  to = "/.netlify/functions/persons?id=:id"
  status = 200

[[redirects]]
  from = "/api/persons"
  to="/.netlify/functions/persons-data"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/verify"
  to = "/.netlify/functions/auth-verify"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
